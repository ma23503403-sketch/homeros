if(!me)me=(await au.signInAnonymously(auth)).user;
return{db,d,uid:me.uid}})());
const snap=s=>({exists:s.exists(),data:()=>s.val()});
window.claude={use:async name=>{
 if(name==='permissions')return{request:async()=>{}};
 const{db,d,uid}=await boot();
 if(name==='user')return{id:async()=>uid};
 if(name==='db')return{doc:p=>{const r=db.ref(d,p);return{get:async()=>snap(await db.get(r)),set:x=>db.set(r,x),update:x=>db.update(r,x),onSnapshot:(cb,er)=>db.onValue(r,s=>cb(snap(s)),er)}}};

   presence:async o=>{const h=o&&o.hm;

 q('#fadd').onclick=async()=>{
  const c=fNorm(q('#fa').value),m=q('#fmsg');
  if(c===fMe.c){m.textContent='ده الـID بتاعك إنت! اكتب ID صديقك';return}
  if(c.length!==6){m.textContent='الـID لازم 6 حروف وأرقام بالإنجليزي (إنت كاتب '+c.length+')';return}
  if(fr.some(f=>f.c===c)){m.textContent='ضفته قبل كده';return}
  let s;try{s=await fDb.doc('players/'+c).get()}catch(e){m.textContent='حصلت مشكلة';return}
  if(!s.exists){m.textContent='مفيش حد بالـID ده. تأكد إن صديقك فتح 👥 أصدقائي وسجّل اسمه';return}
  const nf=fr.concat([{c,n:s.data().n}]);
  try{await fDb.doc('data/users/'+fUid+'/g').update({fr:nf})}catch(e){m.textContent='مقدرتش أحفظ';return}
  fMe.fr=nf;fOpen();
 };
 o.querySelectorAll('.fch').forEach(b=>b.onclick=async()=>{
  const rc=String(1000+Math.random()*9000|0);

  dJoinCode(rc);
 });
}
